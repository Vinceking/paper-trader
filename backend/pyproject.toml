[project]
name = "paper-trader"
version = "0.1.0"
description = "Simulated day-trading platform with a live data feed and a post-trade education layer"

# Upper-bounded deliberately: Vercel's build (uv lock) resolves dependencies
# across every Python version the range implies, including hypothetical
# future ones. An open-ended ">=3.11" made it try to solve for Python 3.14
# on win32, where pandas-ta-classic>=1.0 has no wheel yet, and fail the
# build outright -- even though we only ever run on 3.12 (see .python-version
# / the actual runtime everywhere this deploys).
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "alpaca-py>=0.33",
    "pandas>=2.2",
    "numpy>=1.26",
    "pandas-ta-classic>=0.6.52",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.4's bcrypt backend self-test breaks on bcrypt>=4.1 (removed
    # `bcrypt.__about__`, and its internal >72-byte self-test now raises
    # instead of truncating) — pin to a version passlib actually supports.
    "bcrypt>=3.2,<4.1",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    # async SQLite backs the test DB so integration tests don't need a real
    # Postgres/Docker instance running.
    "aiosqlite>=0.20",
]
# Phase 4 backtest gate (BUILD_SPEC §8.5): VectorBT for the fast parameter
# sweep, Backtrader kept available for event-driven re-verification (see
# app/backtest/verify.py's docstring for why that stage actually reuses
# app/backtest/runner.py instead of wiring backtrader in). Kept OUT of the
# base `dependencies` and imported lazily inside app/backtest/sweep.py
# (not at module scope) because vectorbt's numba/llvmlite/plotly chain
# alone pushed the deployed Vercel function past its 500 MB hard size cap
# (666 MB measured) -- the live-trading API doesn't need these to boot;
# only `POST /strategies/{id}/backtest` does, and that endpoint is run
# from a machine with this extra installed (see the Phase 4 task summary
# and the deployment-fix notes), not from the public serverless deployment.
backtest = [
    "vectorbt>=0.26",
    "backtrader>=1.9.78",
    # vectorbt>=1.0's import-time theme setup breaks on current plotly
    # (removed `scattermapbox` in favor of `scattermap`) -- pinned to the
    # last version that still has it. Not one of Phase 4's "two new
    # dependencies" on its own; required for vectorbt to import at all in
    # this environment. See the Phase 4 task summary.
    "plotly==5.24.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# uv's `uv lock` does a universal, multi-platform resolution by default --
# including sys_platform == 'win32', where pandas-ta-classic>=1.0 ships no
# wheel at all (only sdists that don't build there either). We only ever
# deploy to Linux (Vercel) and develop locally on Windows via pip, not uv,
# so restrict uv's resolution to the one platform it actually needs to solve.
[tool.uv]
environments = ["sys_platform == 'linux'"]
